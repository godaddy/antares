packages:
  - 'apps/*'
  - 'packages/@bento/*'
  - 'packages/@godaddy/*'
  - 'packages/dev/*'
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.2: true
  nx@24.1.0: false
catalog:
  '@nx/vite': 24.1.0
  '@nx/vitest': 24.1.0
  '@react-aria/utils': ^3.34.1
  '@types/mdast': ^4.0.4
  '@types/react': ^19.3.3
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-aria: ^3.53.1
  react-dom: ^19.3.1
  nx: 24.1.0
  '@storybook/addon-docs': ^10.6.9
  '@storybook/react-vite': ^10.6.9
  '@storybook/addon-a11y': ^10.6.9
  '@storybook/addon-onboarding': ^10.6.9
  '@storybook/addon-themes': ^10.6.9
  storybook: ^10.6.9
  tsdown: ^0.23.7
  '@tsdown/css': ^0.23.7
  typescript: 7.0.2
  vite: ^8.4.0
  vitest: ^5.1.2
  '@vitest/browser': ^5.1.2
  '@vitest/browser-playwright': ^5.1.2
  '@vitest/coverage-v8': ^5.1.2
  '@vitest/ui': ^5.1.2
  vitest-browser-react: ^2.3.0
# Nx 24.1 uses the TypeScript 6 compiler API. Workspace packages compile with TypeScript 7.
packageExtensions:
  'nx@24.1.0': &nxTypescript
    optionalDependencies:
      typescript: ^6.0.0
  '@nx/js@24.1.0': *nxTypescript
  '@nx/vite@24.1.0': *nxTypescript
  '@nx/vitest@24.1.0': *nxTypescript
minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.2.0'
  - '@changesets/assemble-release-plan@7.1.0'
  - '@changesets/changelog-git@1.0.1'
  - '@changesets/cli@3.1.0'
  - '@changesets/config@4.1.0'
  - '@changesets/get-dependents-graph@3.0.1'
  - '@changesets/git@4.0.2'
  - '@changesets/parse@1.1.0'
  - '@changesets/pre@3.0.1'
  - '@changesets/read@1.1.0'
  - '@changesets/should-skip-package@1.0.1'
  - '@changesets/types@7.1.0'
  - '@changesets/write@1.1.0'
  - '@nx/devkit@24.1.0'
  - '@nx/js@24.1.0'
  - '@nx/nx-darwin-arm64@24.1.0'
  - '@nx/nx-darwin-x64@24.1.0'
  - '@nx/nx-freebsd-x64@24.1.0'
  - '@nx/nx-linux-arm-gnueabihf@24.1.0'
  - '@nx/nx-linux-arm64-gnu@24.1.0'
  - '@nx/nx-linux-arm64-musl@24.1.0'
  - '@nx/nx-linux-x64-gnu@24.1.0'
  - '@nx/nx-linux-x64-musl@24.1.0'
  - '@nx/nx-win32-arm64-msvc@24.1.0'
  - '@nx/nx-win32-x64-msvc@24.1.0'
  - '@nx/vite@24.1.0'
  - '@nx/vitest@24.1.0'
  - '@nx/workspace@24.1.0'
  - knip@6.49.0
  - lucide-react@1.82.0
  - mermaid@12.4.0
  - nx@24.1.0
  - postcss@8.5.34
