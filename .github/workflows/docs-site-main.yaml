name: Docs Site Main Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'packages/@godaddy/antares/blocks/**'
      - 'packages/@godaddy/antares/components/**/README.mdx'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: gh-pages-docs-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docs Site
        run: pnpm nx build site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/${{ github.event.repository.name }}'

      - name: Prepare for GitHub Pages
        working-directory: apps/site/out
        run: |
          touch .nojekyll
          if [ -d 404 ]; then cp 404/index.html 404.html; fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: ./apps/site/out
          clean: true
          force: false
          attempt-limit: 5
          clean-exclude: |
            storybook
            pr-*
