name: Storybook PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: gh-pages-storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Storybook
        run: npx nx build:storybook docs --skip-nx-cache
        env:
          STORYBOOK_BASE_PATH: '/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}-storybook/'

      - name: Upload Storybook Build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-preview
          path: apps/docs/storybook-static
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Storybook Build
        uses: actions/download-artifact@v8
        with:
          name: storybook-preview
          path: storybook-build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: storybook-build
          target-folder: pr-${{ github.event.pull_request.number }}-storybook
          clean: false
          force: false
          attempt-limit: 5

      - name: Post Preview URL Comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const pagesResponse = await github.rest.repos.getPages({ owner: repo.owner, repo: repo.repo });
            const pagesBaseUrl = pagesResponse.data.html_url.replace(/\/$/, '');
            const previewUrl = `${pagesBaseUrl}/pr-${prNumber}-storybook/`;

            const commentBody = `## 📚 Storybook Preview\n\nPreview URL: ${previewUrl}\n\nPreview will be automatically deleted when this PR is closed.`;

            const comments = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Storybook Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove PR Directory
        run: |
          PR_DIR="pr-${{ github.event.pull_request.number }}-storybook"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "Remove storybook preview for PR #${{ github.event.pull_request.number }}"
            # Retry push with rebase to handle concurrent gh-pages updates
            for i in 1 2 3; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break
              echo "Push failed (attempt $i), retrying..."
              sleep 2
            done
          else
            echo "Preview directory $PR_DIR does not exist, nothing to clean up"
          fi
