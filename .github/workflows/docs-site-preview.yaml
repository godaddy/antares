name: Docs Site PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  # This privileged event only removes files from gh-pages; it never checks out PR code.
  pull_request_target:
    types: [closed]
    branches:
      - main

jobs:
  build-preview:
    if: github.event_name == 'pull_request'
    concurrency:
      group: gh-pages-pr-build-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Docs Site
        run: npx nx build site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}-site'

      - name: Prepare for GitHub Pages
        working-directory: apps/site/out
        run: |
          if [ -d 404 ]; then cp 404/index.html 404.html; fi

      - name: Upload Site Build
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: apps/site/out
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  cleanup-preview:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    concurrency:
      group: gh-pages-pr-deploy-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove PR Directory
        run: |
          PR_DIR="pr-${{ github.event.pull_request.number }}-site"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "Remove docs preview for PR #${{ github.event.pull_request.number }}"
            # Retry push with rebase to handle concurrent gh-pages updates
            for i in 1 2 3; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break
              echo "Push failed (attempt $i), retrying..."
              sleep 2
            done
          else
            echo "Preview directory $PR_DIR does not exist, nothing to clean up"
          fi
