name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  # Run CI when changesets bot pushes to release branches
  # This satisfies required status checks since GITHUB_TOKEN doesn't trigger pull_request events
  push:
    branches:
      - 'changeset-release/**'

# Avoid redundant runs for same PRs
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate shadcn Registry Schema
        run: pnpm run registry:validate

      - name: Build docs dependencies
        run: pnpm nx run @godaddy/generate-cdn-url:build

      - name: Run Dependency Checks
        run: pnpm run deps:check

      - name: Run Type Check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm run test

      - name: Build Bundle Reports
        timeout-minutes: 45
        run: pnpm run bundle-size:build

      - name: Check Bundle Budgets
        run: pnpm run bundle-size:check

      - name: Run Visual Tests
        run: pnpm run test:visual

      - name: Upload Bundle Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bundle-analysis-${{ github.event.pull_request.number || github.run_id }}
          path: .bundle-analysis/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload Visual Test Artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-diffs-${{ github.event.pull_request.number || github.run_id }}
          path: packages/@godaddy/antares/.vitest/attachments/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: ignore
